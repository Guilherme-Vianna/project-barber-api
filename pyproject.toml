[project]
name = "project-barber-api"
version = "0.1.0"
description = "Barbershop appointment REST API with a classic three-layer architecture, ready for Google Cloud Run"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic[email]>=2.12",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.30",
    "alembic>=1.17",
    "firebase-admin>=7.7.0",
    "tzdata>=2026.5",
    "redis>=6",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "ruff>=0.14",
    "taskipy>=1.14.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.taskipy.tasks]
dev = "uvicorn app.main:app --reload --port 8080"
